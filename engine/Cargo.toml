[package]
name = "rfc-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serialization / Zero-copy
rkyv = { version = "0.7", features = ["validation"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4.25"
toml = "0.9.10"

# Hashing & System
blake3 = "1.5" # Very fast hashing for file changes
walkdir = "2.5"
anyhow = "1.0"
thiserror = "1.0"
memmap2 = "0.9" # For loading the index fast

# Parsing
clap = { version = "4.5.51", features = ["derive"] }
# Core Runtime
tree-sitter = "0.25.10"
tree-sitter-language = "0.1.3" # This is the bridge crate

# Modern maintained grammar versions
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-java = "0.23"
tree-sitter-html = "0.23"
tree-sitter-julia = "0.23"
tree-sitter-r = "1.2"
tree-sitter-json = "0.24"

# Use these specific modern replacements
tree-sitter-yaml = "0.7.2"      # Maintained by amaanq/tree-sitter-grammars
tree-sitter-toml-ng = "0.7.0"   # The Next-Gen TOML parser
tree-sitter-sequel = "0.3.11"   # SQL 
tree-sitter-prisma-io = "1.6.0"
tree-sitter-hcl = "1.1.0"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tempfile = "3.10"
