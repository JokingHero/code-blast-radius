[workspace]
members = ["engine", "cli", "app/src-tauri"]
resolver = "2"

[profile.release]
codegen-units = 1      # Slower compile, faster code
lto = "fat"            # Link Time Optimization: removes dead code across crates
opt-level = 3          # Max optimization
panic = "abort"        # Removes stack unwinding code (smaller binary)
strip = true           # Removes symbols (smaller binary)